name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags: '*'

# Take the registry from the eager Pkg server flavor. The default,
# conservative, lags the registry by up to an hour, and bin/ does not resolve
# here: it instantiates committed manifests that pin exact versions. So a
# manifest refreshed against a just-registered package names a version the
# conservative flavor cannot yet see, and CI fails for a version skew that has
# nothing to do with the change. Eager sees what whoever ran
# bin/update_manifests.jl saw.
env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1' # automatically expands to the latest stable 1.x release of Julia.
          - 'nightly'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
          - x86
        # macos-14 and newer (Apple M series) only support aarch64 architecture.
        # These entries introduce new os/arch combinations, so they must also
        # specify `version`: matrix `include` entries do not inherit it, and a
        # null version makes julia-actions/setup-julia fail immediately.
        include:
          - os: macos-latest
            arch: aarch64
            version: '1'
          - os: macos-15-intel
            arch: x64
            version: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v6
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-${{ matrix.os }}
            ${{ runner.os }}-
      - run: julia --color=yes .ci/test_and_change_uuid.jl
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
